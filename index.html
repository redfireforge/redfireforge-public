  <body>
    <div id="root"></div>
    <!--
      Runs BEFORE @vite/client + app. Chrome fires window AT_TARGET listeners in
      registration order (capture flag does not reorder), so this must precede Vite's
      unhandledrejection → forward-console handler or Monaco cancelations still spam
      the console as "Uncaught (in promise) Object".
    -->
    <script>
      (function () {
        function isResizeObserverNoise(value) {
          var m = value && value.message ? value.message : String(value || '');
          return String(m).indexOf('ResizeObserver') !== -1;
        }
        /** Vite #22407 — forward-console send() after HMR disconnect loops forever. */
        function isViteHmrDisconnectNoise(value) {
          var m = value && value.message ? value.message : String(value || '');
          return String(m).indexOf('send was called before connect') !== -1
            || String(m).indexOf('invoke was called before connect') !== -1;
        }
        function isCanceledNoise(text) {
          var msg = String(text || '').trim().toLowerCase();
          return (
            msg === 'canceled'
            || msg === 'cancelled'
            || msg === 'canceled: canceled'
            || msg === 'cancelled: cancelled'
            || msg.indexOf('canceled: canceled') !== -1
            || msg.indexOf('cancelled: cancelled') !== -1
            || msg.indexOf('operation is manually canceled') !== -1
            || msg.indexOf('operation is manually cancelled') !== -1
          );
        }
        /** Monaco cancelations — string, Error (`Canceled: Canceled`), or remount object. */
        function isMonacoCancelation(reason) {
          if (typeof reason === 'string') return isCanceledNoise(reason);
          if (!reason || typeof reason !== 'object') return false;
          if (reason.type === 'cancelation' || reason.type === 'cancellation') return true;
          if (reason.name === 'Canceled' || reason.name === 'Cancelled') return true;
          return isCanceledNoise(String(reason.msg || reason.message || reason));
        }
        function isBenign(e) {
          if (e.type === 'unhandledrejection') {
            var r = e.reason;
            return isResizeObserverNoise(r) || isViteHmrDisconnectNoise(r) || isMonacoCancelation(r);
          }
          var ev = e;
          var m = ev.message || (ev.error && ev.error.message) || (ev.error != null ? String(ev.error) : '');
          return isResizeObserverNoise(m) || isViteHmrDisconnectNoise(m) || isCanceledNoise(m) || isMonacoCancelation(ev.error);
        }
        function swallow(e) {
          if (!isBenign(e)) return;
          e.preventDefault();
          e.stopImmediatePropagation();
        }
        var nativeError = console.error.bind(console);
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && (isCanceledNoise(arg) || isViteHmrDisconnectNoise(arg))) return;
            if (arg && arg.message && isViteHmrDisconnectNoise(arg)) return;
            if (isMonacoCancelation(arg)) return;
          }
          nativeError.apply(console, arguments);
        };
        window.addEventListener('error', swallow, true);
        window.addEventListener('unhandledrejection', swallow, true);

        // Visible fallback when the UI never mounts (Windows WebView2 blank screen).
        var lastFatal = '';
        function recordFatal(text) {
          if (!text) return;
          lastFatal = String(text);
        }
        window.addEventListener('error', function (e) {
          if (isBenign(e)) return;
          recordFatal((e && e.message) || (e && e.error && e.error.message) || 'Script error');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (isBenign(e)) return;
          var r = e && e.reason;
          recordFatal((r && r.message) || r || 'Unhandled promise rejection');
        });
        window.addEventListener('load', function () {
          window.setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.childElementCount > 0) return;
            var panel = document.getElementById('boot-error');
            if (!panel) return;
            panel.hidden = false;
            panel.style.display = 'flex';
            panel.textContent = lastFatal
              ? ('Learning Hub failed to start: ' + lastFatal)
              : 'Learning Hub failed to start: the UI did not mount. The JavaScript bundle may have failed to load.';
          }, 4000);
        });
      })();
    </script>
    <div id="boot-error" hidden style="position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:32px;background:#0f172a;color:#f1f5f9;font:16px/1.5 Segoe UI,sans-serif;white-space:pre-wrap;"></div>
