name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (standard = prod slim, demo = Learning Hub)'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - demo
          - both
      tag_name:
        description: 'Override tag for release (e.g. v0.8.4). Empty = artifact-only build. Do not use -lh.'
        required: false
        default: ''
      checkout_ref:
        description: 'Git ref to check out (e.g. v0.8.2). Defaults to the triggered ref.'
        required: false
        default: ''

jobs:
  # Completes on branch pushes so GitHub reports a passing run instead of
  # "workflow file issue" (which happens when every job is skipped).
  guard:
    name: Skip (not a tag push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'branch'
    steps:
      - run: echo "Not a tag push - build jobs skipped."

  # Job-level `if` is evaluated before the matrix exists, so `matrix.*` there
  # makes GitHub reject the whole workflow (0 jobs, name falls back to the
  # file path). Filter the matrix here instead.
  prepare:
    name: Select build matrix
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
      publish_tag: ${{ steps.select.outputs.publish_tag }}
    steps:
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VARIANT: ${{ inputs.variant }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          rows = [
            {"platform": "macos-latest", "target": "aarch64-apple-darwin", "label": "macOS-ARM64", "variant": "standard"},
            {"platform": "macos-latest", "target": "aarch64-apple-darwin", "label": "macOS-ARM64-Demo", "variant": "demo"},
            {"platform": "macos-15-intel", "target": "x86_64-apple-darwin", "label": "macOS-x64", "variant": "standard"},
            {"platform": "macos-15-intel", "target": "x86_64-apple-darwin", "label": "macOS-x64-Demo", "variant": "demo"},
            {"platform": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "label": "Linux-x64", "variant": "standard"},
            {"platform": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "label": "Linux-x64-Demo", "variant": "demo"},
            {"platform": "windows-2022", "target": "x86_64-pc-windows-msvc", "label": "Windows-x64", "variant": "standard"},
            {"platform": "windows-2022", "target": "x86_64-pc-windows-msvc", "label": "Windows-x64-Demo", "variant": "demo"},
          ]
          event = os.environ["EVENT"]
          ref_name = os.environ["REF_NAME"]
          variant = os.environ.get("VARIANT") or ""
          tag_override = (os.environ.get("TAG_NAME") or "").strip()
          if event == "workflow_dispatch":
              selected = rows if variant == "both" else [r for r in rows if r["variant"] == variant]
              raw = tag_override
          elif event == "push":
              # Legacy vX.Y.Z-lh / vX.Y.Z-demo pushes rebuild Learning Hub only.
              # Both editions always publish to vX.Y.Z (never create a -lh tag).
              if ref_name.endswith("-lh") or ref_name.endswith("-demo"):
                  selected = [r for r in rows if r["variant"] == "demo"]
              else:
                  selected = rows
              raw = ref_name
          else:
              selected = []
              raw = ""
          publish = re.sub(r"-(lh|demo)$", "", raw) if raw else ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include=" + json.dumps(selected, separators=(",", ":")) + "\n")
              fh.write(f"publish_tag={publish}\n")
          PY

  # ⚠️  RELEASE CHECKLIST REMINDER
  # After this workflow completes on a tag push, go to:
  #   https://github.com/redfireforge/redfireforge-public/releases
  # and click "Publish release" on the single draft:
  #   - "RedfireForge vX.Y.Z"  (Standard + Learning Hub assets on one tag)
  # The releases/latest API only returns published, non-prerelease releases —
  # unpublished drafts return null and break the in-app update notifier, download
  build:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.include != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.include) }}

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - id: resolve-ref
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ -n "$CHECKOUT_REF" ]; then
            echo "checkout=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == *-lh || "$REF_NAME" == *-demo ]]; then
            # v0.8.2-lh must build the v0.8.2 tree, not the tag-commit on develop.
            base="${REF_NAME%-lh}"
            base="${base%-demo}"
            echo "checkout=$base" >> "$GITHUB_OUTPUT"
          else
            echo "checkout=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          # Dispatch can override (e.g. checkout_ref=v0.8.2). A vX.Y.Z-lh tag
          # push checks out vX.Y.Z so LH is never built from a later develop tip.
          ref: ${{ steps.resolve-ref.outputs.checkout }}

      - name: Extract release notes from CHANGELOG
        id: notes
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.publish_tag || inputs.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%-lh}"
          VERSION="${VERSION%-demo}"
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | tail -n +2 | sed '$d')
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/redfireforge/redfireforge-public/blob/master/CHANGELOG.md) for details."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev

      - name: Install macOS dependencies (OpenSSL)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Import macOS signing certificate
        # Skipped at the shell level when APPLE_CERTIFICATE is empty.
        # Produces an unsigned build; users open via right-click -> Open.
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set - skipping signing (unsigned build)."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install npm dependencies
        run: npm ci

      - name: Check TLS cert expiry
        if: matrix.variant == 'demo' && !startsWith(matrix.platform, 'windows')
        run: |
          bash scripts/check-cert-expiry.sh
          node scripts/sync-demo-tls-certs.js --check

      - name: Set macOS signing identity (only when a real cert is configured)
        # Tauri v2 calls `security import` whenever APPLE_CERTIFICATE is present
        # in the environment — even as an empty string — because it checks
        # std::env::var().is_ok() rather than checking that the value is non-empty.
        # Likewise for APPLE_SIGNING_IDENTITY. To fully suppress codesigning when
        # no certificate is configured, ALL Apple signing env vars must be completely
        # absent from the process environment, not merely empty strings.
        # We inject them via GITHUB_ENV only when a real certificate is present.
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=$_APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$_APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$_APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build CLI package (required by Tauri bundle resources)
        shell: bash
        run: bash scripts/build-cli-package.sh

      - name: Build sidecar (required by Tauri externalBin)
        run: node scripts/build-sidecar.mjs

      - name: Build Tauri app (standard)
        if: matrix.variant == 'standard'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All Apple signing env vars (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
          # etc.) are injected via GITHUB_ENV by the step above only when a real
          # certificate is present. They must be completely absent (not empty strings)
          # for Tauri v2 to skip codesigning.
          # Updater signing (signs the update payload so the app trusts it)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.publish_tag }}
          releaseName: 'RedfireForge ${{ needs.prepare.outputs.publish_tag }}'
          releaseBody: |
            ${{ steps.notes.outputs.notes }}

            ---
            This release includes **Standard** (`RedfireForge_*`) and **Learning Hub** (`RedfireForge-LearningHub-*`) installers.

            **macOS:** Gatekeeper will block the app on first launch. Run once in Terminal after installing:
            - Standard: `xattr -cr /Applications/RedfireForge.app`
            - Learning Hub: `xattr -cr "/Applications/RedfireForge Learning Hub.app"`
            **Windows:** If SmartScreen appears, click **More info** → **Run anyway**.
            **Linux:** `sudo dpkg -i *.deb` or `chmod +x *.AppImage && ./*.AppImage`

            SHA256 checksums are in `SHA256SUMS.txt` above.
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.publish_tag, '-') }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (Learning Hub)
        if: matrix.variant == 'demo'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All Apple signing env vars injected via GITHUB_ENV above only when cert present.
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Same vX.Y.Z tag as Standard. Filenames already differ (RedfireForge-LearningHub-*).
          # Do not upload latest.json here — that would overwrite Standard's updater file.
          # latest-demo.json is written after all matrix legs finish.
          tagName: ${{ needs.prepare.outputs.publish_tag }}
          releaseName: 'RedfireForge ${{ needs.prepare.outputs.publish_tag }}'
          releaseBody: |
            ${{ steps.notes.outputs.notes }}

            ---
            This release includes **Standard** (`RedfireForge_*`) and **Learning Hub** (`RedfireForge-LearningHub-*`) installers.

            **macOS:** Gatekeeper will block the app on first launch. Run once in Terminal after installing:
            - Standard: `xattr -cr /Applications/RedfireForge.app`
            - Learning Hub: `xattr -cr "/Applications/RedfireForge Learning Hub.app"`
            **Windows:** If SmartScreen appears, click **More info** → **Run anyway**.
            **Linux:** `sudo dpkg -i *.deb` or `chmod +x *.AppImage && ./*.AppImage`

            SHA256 checksums are in `SHA256SUMS.txt` above.
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.publish_tag, '-') }}
          updaterJsonPreferNsis: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: 'RedfireForge-LearningHub-[version]-[platform]-[arch][ext]'
          args: --target ${{ matrix.target }} --config src-tauri/tauri.conf.demo.json

      - name: Cleanup macOS keychain
        if: startsWith(matrix.platform, 'macos') && always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  lh-updater-json:
    name: Publish latest-demo.json
    needs: [prepare, build]
    if: needs.prepare.outputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.publish_tag }}" --dir release-assets --skip-existing || true
      - name: Write latest-demo.json
        run: |
          node scripts/write-latest-demo-json.mjs \
            --dir release-assets \
            --tag "${{ needs.prepare.outputs.publish_tag }}" \
            --out latest-demo.json
      - name: Upload latest-demo.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f latest-demo.json ]; then
            gh release upload "${{ needs.prepare.outputs.publish_tag }}" latest-demo.json --clobber
          else
            echo "No latest-demo.json to upload."
          fi

  sbom:
    name: Generate SBOM
    needs: [prepare, build]
    # Only for an actual tag push — a manual workflow_dispatch test run has no
    # tag to attach the asset to.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          # This workflow triggers on `push: tags`, not the native `release`
          # event, and tauri-action (not this action) owns release creation —
          # disable the action's own auto-upload heuristic so there is exactly
          # one, explicit upload path below instead of two ambiguous ones.
          upload-release-assets: false

      - name: Upload SBOM to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # tauri-action creates the (draft) release per matrix leg above; attach
        # the SBOM as an extra asset via the tag name rather than the
        # deprecated actions/upload-release-asset@v1 + upload_url pattern.
        run: gh release upload "${{ needs.prepare.outputs.publish_tag }}" sbom.spdx.json --clobber

  checksums:
    name: Generate SHA256 checksums
    needs: [prepare, build, lh-updater-json]
    if: >-
      always()
      && needs.build.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
      && needs.prepare.outputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.publish_tag }}" --dir release-assets --skip-existing || true

      - name: Compute SHA256SUMS
        run: |
          cd release-assets
          # Exclude existing checksum files and JSON metadata
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name '*.json' \
            -exec shasum -a 256 {} \; \
            | sed 's|^\(.*\)  \./|\1  |' \
            | sort > SHA256SUMS.txt
          echo "── Checksums ──────────────────────────────────"
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.publish_tag }}" release-assets/SHA256SUMS.txt --clobber
