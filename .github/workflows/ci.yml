name: CI

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - master

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            demo:
              - 'packages/demo-hub/**'
              - 'src/app/demo/**'
              - 'src/config/features.ts'
              - 'src/**/useDemo*.ts'
              - 'src/features/graphql/DemoGqlStudioBridges.tsx'
              - 'src/app/components/AppLiveDemoOverlay.tsx'
              - 'src/app/components/AppLiveDemoOverlay.test.tsx'
              - '.env.production.demo'
              - 'src-tauri/tauri.conf.demo.json'
              - 'e2e/demo-**'
              - 'e2e/demo-player-helpers.ts'
              - 'e2e/graphql-lesson-smoke-helpers.ts'
              - 'e2e/graphql-demo-workspace-helpers.ts'
              - '.github/workflows/demo-nightly.yml'
              - 'vitest.projectPatterns.ts'
              - 'vitest.config.ts'
              - 'scripts/product-coverage-filter.ts'
              - 'src/test-utils/vitestProjectSplit.test.ts'
            product:
              - 'src/**'
              - 'cli/**'
              - 'src-server/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vitest.projectPatterns.ts'
              - 'e2e/**'
              - 'playwright.config.ts'

  cert-expiry:
    name: Demo TLS cert expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/check-cert-expiry.sh
      - run: node scripts/sync-demo-tls-certs.js --check

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/ cli/

  unit-tests-product:
    name: Unit Tests (product)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    # Same-repo PRs already ran these on the branch push, and again on the merge
    # commit — running a third time delays the PR check past the merge. Two cases
    # still run: fork PRs get no push event here, and PRs into `master` are gated
    # before the merge as well as after, since it is the stable release branch.
    if: >-
      (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.base_ref == 'master')
      && needs.changes.outputs.product == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run product coverage (2 shards — matches CI runner vCPU count)
        run: npm run test:product:coverage:fast
        env:
          COVERAGE_SHARDS: 2
      - name: Check coverage thresholds
        run: |
          echo "Product coverage report generated. Review in PR for >90% target."

  unit-tests-demo:
    name: Unit Tests (demo)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: >-
      (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.base_ref == 'master')
      && needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:demo

  build-frontend:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npm run audit:prod-demo-bundle
      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build failed — dist/index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          du -sh dist/

  # E2E tests have been moved to e2e-nightly.yml (nightly schedule + workflow_dispatch).
  # See .github/workflows/e2e-nightly.yml to run them manually or view results.
