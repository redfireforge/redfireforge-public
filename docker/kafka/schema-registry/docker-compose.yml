name: rff-kafka-schema-registry

services:
  # ── Kafka broker (Redpanda) ────────────────────────────────────────────────
  # Uses port 19094 (external) to avoid collision with plaintext (19092) and
  # secure (19093) profiles.  Internal port 9092 is the standard KafkaJS port.
  redpanda-sr:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.18
    container_name: redfireforge-redpanda-sr
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19094
      - --advertise-kafka-addr=internal://redpanda-sr:9092,external://localhost:19094
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-sr:33145
      # Disable the built-in Schema Registry listener (we use cp-schema-registry instead)
      - --schema-registry-addr=internal://0.0.0.0:18082
    ports:
      - "19094:19094"
      - "19647:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # ── Confluent Schema Registry ──────────────────────────────────────────────
  # Uses Kafka (Redpanda) as the _schemas topic backend store.
  # Port 8085 to avoid collision with Redpanda's built-in pandaproxy (18082)
  # and any other local services.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: redfireforge-schema-registry
    depends_on:
      redpanda-sr:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: redpanda-sr:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      # Suppress interactive license prompt
      SCHEMA_REGISTRY_CUB_KAFKA_TIMEOUT: 60
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # ── Topic initialisation ───────────────────────────────────────────────────
  # Creates the topics needed for smoke tests.  Runs after schema-registry is
  # healthy so the _schemas topic is already initialised.
  redpanda-sr-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.18
    container_name: redfireforge-redpanda-sr-init
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        rpk topic create sr.smoke.avro      --partitions 3 --replicas 1 --brokers redpanda-sr:9092 || true
        rpk topic create sr.smoke.batch     --partitions 3 --replicas 1 --brokers redpanda-sr:9092 || true
        rpk topic create sr.smoke.errors    --partitions 1 --replicas 1 --brokers redpanda-sr:9092 || true
        echo "Topics created."
    restart: "no"
