[package]
name = "redfireforge"
version = "0.8.5-beta.1"
description = "RedfireForge - API Performance Testing Tool"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "gzip", "brotli", "rustls", "multipart", "http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
rand = "0.9"
regex = "1"
jsonschema = "0.27"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
hdrhistogram = "7"
rdkafka = { version = "0.37", features = ["cmake-build", "ssl"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
bytes = "1"
http = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
tonic = { version = "0.12", features = ["tls", "transport"] }
tonic-health = "0.12"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types = "0.13"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
sxd-document = "0.3"
sxd-xpath = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
tauri-plugin-connector = { version = "0.12", optional = true }
tauri-plugin-mcp-bridge = "0.11.2"

[features]
default = []
mcp-bridge = ["tauri-plugin-connector"]
